name: Validate AgentForge
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-10-24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, resolved 2026-10-24
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m agentforge validate
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_docs.py
