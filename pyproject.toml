[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-local"
version = "0.1.0"
description = "Explicit, recoverable installation of evidence-oriented agent skills"
requires-python = ">=3.12"
dependencies = ["jsonschema==4.26.0"]

[project.scripts]
af = "agentforge.cli:main"

[tool.setuptools]
packages = ["agentforge"]

[tool.setuptools.package-data]
agentforge = ["schemas/*.json"]
